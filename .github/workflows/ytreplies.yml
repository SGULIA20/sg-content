name: ytreplies

# YouTube comment replies (founder, 24 Oct 2026): drafts go to Telegram for Post / Skip; approved ones are posted.
# The Post button starts this workflow at once; otherwise every three hours.
on:
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ytreplies
  cancel-in-progress: false

jobs:
  replies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post approved replies, draft new ones
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
          SG_COMMAND_KEY: ${{ secrets.SG_COMMAND_KEY }}
        run: python -m engine.ytreplies
      - name: Remember which comments were drafted
        if: always()
        run: |
          git config user.name "sg-content-bot"
          git config user.email "sg-content-bot@users.noreply.github.com"
          git add -f logs/yt-replies.json || true
          git diff --cached --quiet || git commit -m "ytreplies [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
