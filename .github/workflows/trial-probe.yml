# One-off (27 Oct 2026): does the Instagram API say whether a Trial Reel was shared with followers? Reads fields only. Delete after use.
name: trial-probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python - <<'PY'
          import os
          from engine import instagram as ig
          tok, uid = os.environ["IG_ACCESS_TOKEN"], os.environ["IG_USER_ID"]
          ids = {"sglearning 24 Oct": "18104432204309323", "arthvan 24 Oct": "18117405940816771", "sglearning 21 Oct (normal)": None}
          fields = ["media_product_type", "media_type", "is_shared_to_feed", "trial_params", "is_comment_enabled", "boost_eligibility_info",
                    "permalink", "shortcode", "timestamp", "like_count", "comments_count", "legacy_instagram_media_id", "copyright_check_information"]
          for name, mid in ids.items():
              if not mid: continue
              print("==", name)
              for f in fields:
                  try:
                      print("  ", f, "=", ig.call("GET", f"/{mid}", tok, {"fields": f}).get(f))
                  except Exception as e:
                      print("  ", f, "-> error", str(e)[:120])
          media = ig.call("GET", f"/{uid}/media", tok, {"fields": "id,timestamp,media_product_type", "limit": "30"}).get("data", [])
          ids_listed = {m["id"] for m in media}
          for name, mid in ids.items():
              if mid: print(name, "listed in /media:", mid in ids_listed)
          PY
