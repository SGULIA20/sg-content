name: takedown

# One-off (founder, 29 Oct 2026): remove a posted piece from YouTube, Instagram (Reel + Story) and Threads. scripts/take_down.py
on:
  workflow_dispatch:
    inputs:
      piece:
        description: 'Piece id to take down'
        required: true

permissions:
  contents: write

jobs:
  takedown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Take it down
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
          PIECE: ${{ github.event.inputs.piece }}
        run: python scripts/take_down.py "$PIECE"
      - name: Save the record
        if: always()
        run: |
          git config user.name "sg-content-bot"; git config user.email "sg-content-bot@users.noreply.github.com"
          python -m engine.gitsync "takedown: ${{ github.event.inputs.piece }} [skip ci]" pieces
