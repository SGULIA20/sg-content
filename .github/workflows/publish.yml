name: publish

on:
  schedule:
    - cron: '33 8 * * *'      # 14:00 India: Learning with SG Reel + Story + Threads + LinkedIn (after the 07:05 UTC produce run)
    - cron: '33 9 * * *'      # second chance an hour later (the engine never posts a piece twice)
    - cron: '33 10 * * *'
    - cron: '3 16 * * *'      # 21:30 India daily: SG-MYTH-WORLD Reel + Story + Threads + LinkedIn (founder's table, 21 Oct 2026)
    - cron: '3 17 * * *'      # second chance
  workflow_dispatch:
    inputs:
      channel:
        description: 'which channel slot to run now'
        type: choice
        options: [sglearning, arthvan]
        default: sglearning

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Pick the channel for this slot (from the schedule that fired, not the clock)
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.channel }}" ]; then echo "channel=${{ github.event.inputs.channel }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "33 8 * * *" ] || [ "${{ github.event.schedule }}" = "33 9 * * *" ] || [ "${{ github.event.schedule }}" = "33 10 * * *" ]; then echo "channel=sglearning" >> "$GITHUB_OUTPUT"
          else echo "channel=arthvan" >> "$GITHUB_OUTPUT"; fi
      - name: Git identity
        run: |
          git config user.name "sg-content-bot"
          git config user.email "sg-content-bot@users.noreply.github.com"
      - name: Tell the control room this run started
        env:
          SG_COMMAND_KEY: ${{ secrets.SG_COMMAND_KEY }}
        run: python -m engine.command_center --report publish-start
      - name: Post what is due (each posted piece is committed and pushed at once)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}                    # Short -> long-video links (engine/ytlink.py)
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SG_COMMAND_KEY: ${{ secrets.SG_COMMAND_KEY }}
        run: python -m engine.publish --channel ${{ steps.slot.outputs.channel }}
      - name: Tell the control room how it went
        if: always()
        env:
          SG_COMMAND_KEY: ${{ secrets.SG_COMMAND_KEY }}
        run: python -m engine.command_center --report publish-end
      - name: Commit piece records and logs
        if: always()
        run: |
          # settles a clash with a produce run instead of failing the run
          python -m engine.gitsync "publish: $(date -u +%Y-%m-%dT%H:%M)" pieces logs
