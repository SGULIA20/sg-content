name: yt-describe

# Read-only: title, length and description of given videos (engine/ytdescribe.py).
# Its own concurrency group, so the 5-minute Studio poll never cancels it.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: sglearning or arthvan
        default: arthvan
      ids:
        description: comma-separated video ids
        required: true

permissions:
  contents: read

concurrency:
  group: yt-describe
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: Describe the videos
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          IDS: ${{ inputs.ids }}
        run: python -m engine.ytdescribe "$CHANNEL" "$IDS"
