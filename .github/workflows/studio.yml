name: studio

# The Studio bot (founder, 4 Nov 2026): intro clips, thumbnails and Reel X-rays sent to the separate Telegram bot (engine/studio.py),
# then the intro sweep when a waiting piece has its clip or has passed its deadline (engine/intro.py). No always-on server: every 5 minutes,
# started by the Supabase clock (command.clock, docs/external-scheduler.md); the cron below is only the backup (GitHub fired it once in 8 h).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      redo:
        description: 'piece id to re-upload with its intro clip (engine/intro.py --redo), blank = normal poll + sweep'
        required: false
        default: ''
      uploads:
        description: 'piece id: list its private scheduled uploads on YouTube (engine/intro.py --uploads), no sweep'
        required: false
        default: ''
      tidy:
        description: 'piece id, or all: remove private scheduled copies on YouTube except the recorded one (engine/intro.py --tidy), no sweep'
        required: false
        default: ''

permissions:
  contents: write
  actions: write            # starts the daily review (first step)

concurrency:
  group: studio
  cancel-in-progress: false

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 120          # a 12-minute long is re-made from the caches and re-uploaded here (4 Nov 2026)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: Restore the voice and picture caches (a long is re-made from them to carry the intro)
        uses: actions/cache@v5
        with:
          path: cache
          key: sg-cache-${{ github.run_id }}
          restore-keys: sg-cache-
      # 27 Nov 2026: GitHub's own schedule started the daily review ten hours late on two days running. This job is started on time
      # by the outside clock, so it starts the review: Tuesday to Sunday from 06:15 Lagos until today's is saved.
      - name: Start the daily review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(TZ=Africa/Lagos date +%H%M); dow=$(TZ=Africa/Lagos date +%u); today=$(date -u +%F)
          if [ "$dow" = 1 ] || [ "$now" -lt 0615 ] || [ "$now" -ge 1400 ]; then exit 0; fi
          if grep -q "\"date\": \"$today\"" logs/postmortem.json 2>/dev/null; then exit 0; fi
          gh workflow run daily-review.yml --ref main && echo "started the review for $today" || true
      # founder, 27 Nov 2026: the topics are searched for afresh every morning, after the review, so yesterday's lessons and today's
      # trends reach the videos made today (a long the same day, a Short for tomorrow). No new video starts on an older plan.
      - name: Start the day's topic search
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(TZ=Africa/Lagos date +%H%M); dow=$(TZ=Africa/Lagos date +%u); today=$(date -u +%F)
          if [ "$now" -lt 0620 ] || [ "$now" -ge 1300 ]; then exit 0; fi
          if grep -q "\"generated\": \"$today" content/weekly-plan.json 2>/dev/null; then exit 0; fi
          # the review first (not on Monday, when it is part of the weekly report); after 07:15 the search no longer waits for it
          if [ "$dow" != 1 ] && [ "$now" -lt 0715 ] && ! grep -q "\"date\": \"$today\"" logs/postmortem.json 2>/dev/null; then exit 0; fi
          gh workflow run weekly.yml --ref main && echo "started the topic search for $today" || true
      - name: Git identity
        run: |
          git config user.name "sg-content-bot"
          git config user.email "sg-content-bot@users.noreply.github.com"
      - name: Answer the Studio bot
        env:
          TELEGRAM_STUDIO_TOKEN: ${{ secrets.TELEGRAM_STUDIO_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
        run: python -m engine.studio
      - name: Collect clips saved by the Arthvan bot
        if: github.event.inputs.uploads == '' && github.event.inputs.tidy == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m engine.handover
      - name: List a piece's scheduled uploads on YouTube
        if: github.event.inputs.uploads != ''
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
        run: python -m engine.intro --uploads "${{ github.event.inputs.uploads }}"
      - name: Remove a piece's superseded uploads on YouTube
        if: github.event.inputs.tidy != ''
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
        run: python -m engine.intro --tidy "${{ github.event.inputs.tidy }}"
      - name: Is a sweep needed?
        id: need
        run: |
          if [ -n "${{ github.event.inputs.uploads }}${{ github.event.inputs.tidy }}" ]; then echo "yes=0" >> "$GITHUB_OUTPUT"; elif [ -n "${{ github.event.inputs.redo }}" ] || python -m engine.intro --needed; then echo "yes=1" >> "$GITHUB_OUTPUT"; else echo "yes=0" >> "$GITHUB_OUTPUT"; fi
      - name: ffmpeg, fonts and the browser for the cards
        if: steps.need.outputs.yes == '1'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji
          python -m playwright install --with-deps chromium
          if python -m engine.opening; then pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q transformers opencv-python-headless rembg onnxruntime || echo "tools not installed, the intro is shown full-screen as recorded"; fi
      - name: Sweep (compose + upload) or redo one piece
        if: steps.need.outputs.yes == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.redo }}" ]; then python -m engine.intro --redo "${{ github.event.inputs.redo }}"; else python -m engine.intro --sweep; fi
      - name: Commit pieces, media and logs
        if: always()
        run: |
          python -m engine.gitsync "studio: $(date -u +%Y-%m-%dT%H:%M)"
