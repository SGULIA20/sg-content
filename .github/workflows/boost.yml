name: boost

# Gated Instagram Reel boosting (founder, 6 Nov 2026): once a day, at most one Reel that passed the organic gate, Rs 350 for one day.
# engine/metaboost.py, settings in content/meta-boost.json. mode "probe" creates the ad paused and spends nothing.
on:
  schedule:
    - cron: '30 3 * * *'            # 09:00 India, 05:00 WAT
  workflow_dispatch:
    inputs:
      action:
        description: 'run (default) | report | pause (pause every live boost now)'
        required: false
        default: 'run'

permissions:
  contents: write

concurrency:
  group: boost
  cancel-in-progress: false

jobs:
  boost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "sg-content-bot"
          git config user.email "sg-content-bot@users.noreply.github.com"
      - name: Boost
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ inputs.action }}" in
            report) python -m engine.metaboost --report ;;
            pause) python -m engine.metaboost --pause ;;
            *) python -m engine.metaboost ;;
          esac
      - name: Save the boost log
        if: always()
        run: |
          git add -f logs/meta-boost.json || true
          git diff --cached --quiet || git commit -m "boost: log [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
