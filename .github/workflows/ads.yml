name: ads

# YouTube promotion watch, phase 1 (founder, 30 Oct 2026): every 6 hours the guard may pause campaigns (never raise or start one);
# the 20:30 WAT run also sends the daily Telegram line. engine/ads.py, settings in content/ads.json.
on:
  schedule:
    - cron: '30 1,7,13 * * *'
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      check:
        description: 'yes = only check the Google Ads permission and list the reachable accounts'
        required: false
        default: ''
      launch:
        description: 'check = Google validates the test campaigns (nothing spent); live = create them (engine/adlaunch.py)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ads
  cancel-in-progress: false

jobs:
  ads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "sg-content-bot"
          git config user.email "sg-content-bot@users.noreply.github.com"
      - name: Watch the ads
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SG_COMMAND_KEY: ${{ secrets.SG_COMMAND_KEY }}
        run: |
          if [ "${{ github.event.inputs.launch }}" = "check" ]; then python -m engine.adlaunch
          elif [ "${{ github.event.inputs.launch }}" = "live" ]; then python -m engine.adlaunch --live
          else python -m engine.ads ${{ github.event.inputs.check == 'yes' && '--check' || (github.event.schedule == '30 19 * * *' && '--report' || '') }}
          fi
      - name: Save the state
        if: always()
        run: |
          python -m engine.gitsync "ads: $(date -u +%Y-%m-%dT%H:%M) [skip ci]" logs
