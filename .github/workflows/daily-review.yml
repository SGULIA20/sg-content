name: daily-review

# Every video is reviewed the morning after it goes out (founder, 24 Nov 2026: "review each reel or long video you are posting and
# take necessary actions for next reel or video"). 06:17 WAT, Tuesday to Sunday (Monday's review is part of the weekly report): reads
# each recent video's Instagram and YouTube numbers, renews the lessons the writers and the planner read, and tells the founder only
# what changed. engine/postmortem.py --daily. Two Opus requests a day.
on:
  schedule:
    # 25-26 Nov 2026: GitHub started the one slot ten hours late, then not at all by mid-afternoon. Several slots; the first to run
    # does the review and the rest see today's date in logs/postmortem.json and stop.
    - cron: '17 5 * * 0,2-6'
    - cron: '17 7 * * 0,2-6'
    - cron: '17 9 * * 0,2-6'
    - cron: '17 12 * * 0,2-6'
  workflow_dispatch:
    inputs:
      force:
        description: 'yes = review again even if today is already saved'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Already reviewed today?
        id: done
        run: |
          if [ "${{ github.event.inputs.force }}" != "yes" ] && grep -q "\"date\": \"$(date -u +%F)\"" logs/postmortem.json 2>/dev/null; then echo "yes=1" >> "$GITHUB_OUTPUT"; echo "today's review is already saved"; fi
      - run: pip install -r requirements.txt
        if: steps.done.outputs.yes != '1'
      - name: Review yesterday's videos and renew the lessons
        if: steps.done.outputs.yes != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.postmortem --daily
      - name: Keep the lessons
        if: always()
        run: |
          git config user.name "sg-content-bot"
          git config user.email "sg-content-bot@users.noreply.github.com"
          git add -f logs/postmortem.json logs/told.json logs/claude-spend.json || true
          git diff --cached --quiet && exit 0
          git commit -m "daily review [skip ci]"
          # 25 Nov 2026: GitHub answered the one push with "Internal Server Error" and that day's lessons were lost
          for n in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((n * 20))
          done
          exit 1
