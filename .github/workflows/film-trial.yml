name: film-trial

# A trial Short whose whole body is the founder's own moving clips, slowed to fit the narration (founder, 27 Nov 2026). Sent to his
# Telegram; never uploaded, nothing committed. scripts/film_trial.py.
on:
  workflow_dispatch:
    inputs:
      piece:
        description: 'piece id, e.g. preview-abhimanyu (its clips are in inbox/scenes/<id>/clip1.mp4 ...)'
        required: true

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build the trial and send it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SG_MUSIC: '1'
        run: python scripts/film_trial.py "${{ inputs.piece }}" out/film-trial
      - name: Keep the trial as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-trial
          path: out/film-trial/*/reel.mp4
          retention-days: 3
