name: film-trial

# A trial Short whose whole body is the founder's own moving clips, slowed to fit the narration (founder, 27 Nov 2026). Sent to his
# Telegram; never uploaded, nothing committed. scripts/film_trial.py.
on:
  workflow_dispatch:
    inputs:
      piece:
        description: 'piece id, e.g. preview-abhimanyu (its clips are in inbox/scenes/<id>/clip1.mp4 ...)'
        required: true

permissions:
  contents: write      # only the audit's report and contact sheet are saved (logs/audit/)

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build the trial and send it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SG_MUSIC: '1'
        run: python scripts/film_trial.py "${{ inputs.piece }}" out/film-trial
      - name: Save the audit
        if: always()
        run: |
          git config user.name "sg-content-bot"; git config user.email "sg-content-bot@users.noreply.github.com"
          git add -f logs/audit || true
          git diff --cached --quiet && exit 0
          git commit -q -m "audit: ${{ inputs.piece }} [skip ci]"
          for n in 1 2 3 4; do git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0; sleep $((n * 20)); done
          exit 1
      - name: Keep the trial as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-trial
          path: out/film-trial/*/reel.mp4
          retention-days: 3
