name: thumbtest

# Thumbnail click test for long videos (founder, 23 Oct 2026): B goes up two days after a long video is public; the better one stays.
on:
  schedule:
    - cron: '41 11 * * *'    # daily, 12:41 Lagos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thumbtest
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Move each long video's thumbnail test on
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.thumbtest
      - name: Record the test state
        if: always()
        run: |
          git config user.name "sg-content-bot"
          git config user.email "sg-content-bot@users.noreply.github.com"
          git add -f pieces || true
          git diff --cached --quiet || git commit -m "thumbtest [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
