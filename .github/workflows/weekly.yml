name: weekly

# Weekly YouTube research and the topic plan for the coming days (founder, 7 Nov 2026: "we must do this deep research every week and decide
# topics for the next week"). Sunday 17:17 WAT: reads what viewers watch on YouTube, has Claude propose a topic for every open slot, scores
# them (engine/topicscore.py), writes content/weekly-plan.json and sends the plan to Telegram. engine/weekly.py. Uses about 1,600 YouTube
# quota units (16 searches) and one Sonnet call per channel.
on:
  schedule:
    - cron: '17 16 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "sg-content-bot"
          git config user.email "sg-content-bot@users.noreply.github.com"
      - name: Research and plan the week
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.weekly
      - name: Save the plan
        if: always()
        run: |
          git add -f content/weekly-plan.json || true
          git diff --cached --quiet || git commit -m "weekly plan: topics for the coming days [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
