name: weekly

# Weekly YouTube research and the topic plan for the coming days (founder, 7 Nov 2026: "we must do this deep research every week and decide
# topics for the next week"). Sunday 17:17 WAT: reads what viewers watch on YouTube, has Claude propose a topic for every open slot, scores
# them (engine/topicscore.py), writes content/weekly-plan.json and sends the plan to Telegram. engine/weekly.py. Uses about 3,200 YouTube
# quota units a run (32 searches: all videos of 14 days, and short videos of 7 days) and one Sonnet call per channel.
on:
  schedule:
    - cron: '17 16 * * 0,2,4'   # Sunday, Tuesday, Thursday (founder, 24 Nov 2026: trending topics reach Learning viewers within days)
  workflow_dispatch:
    inputs:
      force:
        description: 'yes = plan again even if today is already planned'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Already planned today?
        id: done
        run: |
          if [ "${{ github.event.inputs.force }}" != "yes" ] && grep -q "\"generated\": \"$(date -u +%F)" content/weekly-plan.json 2>/dev/null; then echo "yes=1" >> "$GITHUB_OUTPUT"; echo "today's plan is already saved"; fi
      - run: pip install -q -r requirements.txt
        if: steps.done.outputs.yes != '1'
      - name: Git identity
        run: |
          git config user.name "sg-content-bot"
          git config user.email "sg-content-bot@users.noreply.github.com"
      - name: Research and plan the week
        if: steps.done.outputs.yes != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.weekly
      - name: Save the plan
        if: always()
        run: |
          git add -f content/weekly-plan.json logs/claude-spend.json || true
          git diff --cached --quiet || git commit -m "weekly plan: topics for the coming days [skip ci]"
          for n in 1 2 3 4; do git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0; sleep $((n * 20)); done
          exit 1
