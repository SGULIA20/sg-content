name: restart-schedule

# One-off (founder, 27 Nov 2026: "Remove all scheduled posts and let us go with what we decided"): every video still waiting on
# YouTube is taken off the schedule (made private, kept, never deleted) unless it was made the new way, and its slot is emptied so
# the next produce run makes a new video for it. scripts/restart_schedule.py. Blank input lists only.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'yes = take them off the schedule; blank = list only'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: restart-schedule
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: List, or take off the schedule
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
        run: python scripts/restart_schedule.py ${{ github.event.inputs.apply == 'yes' && '--apply' || '' }}
      - name: Save the emptied slots
        if: always() && github.event.inputs.apply == 'yes'
        run: |
          git config user.name "sg-content-bot"; git config user.email "sg-content-bot@users.noreply.github.com"
          git add -A pieces out inbox
          git diff --cached --quiet && exit 0
          git commit -q -m "restart: old scheduled videos taken off the schedule, their slots emptied [skip ci]"
          for n in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((n * 20)); done
          exit 1
