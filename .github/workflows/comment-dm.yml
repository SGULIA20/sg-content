name: comment-dm

# Comment APP, get the link by DM (founder, 23 Oct 2026): answers new Instagram comments that ask for the app, once each.
on:
  schedule:
    - cron: '17 * * * *'     # hourly; GitHub may skip some hours, and a comment can still be answered for 7 days
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comment-dm
  cancel-in-progress: false

jobs:
  dm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Answer comments that ask for the app
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.commentdm
      - name: Remember who was answered
        if: always()
        run: |
          git config user.name "sg-content-bot"
          git config user.email "sg-content-bot@users.noreply.github.com"
          git add -f logs/comment-dm.json || true
          git diff --cached --quiet || git commit -m "comment-dm [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
