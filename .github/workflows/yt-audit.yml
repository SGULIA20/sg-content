name: yt-audit

# Read-only: lists every private or scheduled video on both YouTube channels against the repo's records (engine/intro.py --audit).
# Its own concurrency group, so the 5-minute Studio poll never cancels it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yt-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: List the scheduled videos
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
        run: python -m engine.intro --audit
