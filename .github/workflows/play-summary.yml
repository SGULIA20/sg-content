# One-off (25 Oct 2026): installs, store visitors and conversion per app for the founder's question "how to boost downloads". Read only.
name: play-summary
on: workflow_dispatch
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - env:
          PLAY_READER_KEY_B64: ${{ secrets.PLAY_READER_KEY_B64 }}
        run: |
          python -m engine.playreports --summary
          python - <<'PY'
          from engine import playreports as pr
          tok = pr.access_token(pr.SCOPE_STORAGE)
          d = pr.fetch_rows(tok)
          for app, x in d.items():
              print("==", app)
              for r in sorted(x["store"], key=lambda r: pr._col(r, "Date"))[-35:]:
                  print({k: v for k, v in r.items() if v not in ("", "0")})
          PY
