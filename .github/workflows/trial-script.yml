name: trial-script

# Writes a trial script for one piece with the current rules and sends it to the founder's Telegram; nothing is saved or uploaded (11 Nov 2026).
on:
  workflow_dispatch:
    inputs:
      piece:
        description: 'piece id, e.g. 2026-11-17-sglearning-short'
        required: true

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write the trial script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/trial_script.py "${{ inputs.piece }}"
