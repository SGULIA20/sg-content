name: rethumb

# One-off (founder, 27 Oct 2026): the new topic-name thumbnail for every video already made, posted or scheduled (scripts/rethumb.py).
# About ₹3 of picture per video. Delete once it has run.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Piece ids separated by spaces (empty = every video already on YouTube)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: rethumb
  cancel-in-progress: false

jobs:
  rethumb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore the picture cache (a re-run does not pay twice)
        uses: actions/cache@v5
        with:
          path: cache
          key: sg-cache-${{ github.run_id }}
          restore-keys: sg-cache-
      - run: pip install -r requirements.txt
      - name: Fonts and the browser that draws the text
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-core
          python -m playwright install --with-deps chromium
      - name: New thumbnails
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
          IDS: ${{ github.event.inputs.ids }}
        run: python scripts/rethumb.py --yes $IDS
      - name: Keep only what posting needs, then save
        if: always()
        run: |
          git config user.name "sg-content-bot"
          git config user.email "sg-content-bot@users.noreply.github.com"
          python scripts/prune_out.py --days 14
          python -m engine.gitsync "rethumb: new thumbnails"
