name: produce

on:
  schedule:
    - cron: '13 7 * * *'   # 08:05 Lagos, 12:35 India: right after Gemini's daily voice quota resets (midnight Pacific = 07:00 UTC)
    - cron: '43 7 * * *'  # GitHub fired the 07:05 slot seven hours late on 21 Oct 2026: several chances, the engine never remakes a finished piece
    - cron: '13 8 * * *'
    - cron: '13 9 * * *'   # safety net
    - cron: '43 13 * * *' # afternoon catch-up: finishes what failed earlier and keeps filling the 4-5 day buffer
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'render only, no upload'
        type: boolean
        default: false
      unlisted:
        description: 'first day: upload unlisted, skip Instagram and Threads'
        type: boolean
        default: false
      max:
        description: 'pieces to make this run'
        default: '3'

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 300          # batch lanes wait on jobs; a run may make 6-8 pieces (each piece is committed as it finishes)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore the voice and picture caches
        uses: actions/cache@v4
        with:
          path: cache
          key: sg-cache-${{ github.run_id }}
          restore-keys: sg-cache-
      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Unit tests
        run: python -m pytest -q -m "not slow"
      - name: Git identity
        run: |
          git config user.name "sg-content-bot"
          git config user.email "sg-content-bot@users.noreply.github.com"
      - name: Make what the buffer needs (each finished piece is committed and pushed at once)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNLISTED_DAY1: ${{ github.event.inputs.unlisted == 'true' && '1' || '' }}
        run: |
          ARGS="--max ${{ github.event.inputs.max || '6' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m engine.produce $ARGS
      - name: Prune media older than 14 days
        if: always()
        run: python scripts/prune_out.py --days 14
      - name: Commit anything still uncommitted (pieces, media, logs) and push
        if: always()
        run: |
          git add -f -A pieces out logs || true
          [ -f content/voice.json ] && git add content/voice.json || true
          git diff --cached --quiet || git commit -m "produce: $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
