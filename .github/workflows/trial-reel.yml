name: trial-reel

# One-off (founder, 9 Nov 2026: "I want to see the complete reel trial first"): builds one hand-written trial Short with the new opening
# style and sends the MP4 to the founder's Telegram chat. Never uploaded to YouTube or Instagram. About Rs 25 of pictures and voice.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Trial spec in the repo'
        required: false
        default: 'content/trial/dwarka.json'

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build the trial Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/trial_reel.py "${{ inputs.spec }}" out/trial/trial.mp4
      - name: Send it to the founder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from pathlib import Path; from engine import telegram; print(telegram.send_file(Path('out/trial/trial.mp4'), 'Trial Short (new opening style). AI visualisation pictures, not photographs. Never uploaded.'))"
