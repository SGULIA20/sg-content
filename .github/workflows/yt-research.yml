name: yt-research

# Read-only: the most-viewed Hindi videos in India over the last 14 days for our two topic areas (engine/ytresearch.py).
# Its own concurrency group, so the 5-minute Studio poll never cancels it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yt-research
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: Top viewed videos last 14 days
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
        run: python -m engine.ytresearch
