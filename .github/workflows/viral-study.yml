name: viral-study

# Read-only study (founder, 27 Nov 2026: "advise from YouTube search viral reels" on the body of our videos): Gemini watches the week's
# most-viewed short videos in each channel's field and Claude sets how they are made beside how ours are. scripts/viral_study.py.
# Changes nothing in the engine; saves logs/viral-study.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Watch and compare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
        run: python scripts/viral_study.py
      - name: Save the study
        if: always()
        run: |
          git config user.name "sg-content-bot"; git config user.email "sg-content-bot@users.noreply.github.com"
          git add -f logs/viral-study.json logs/gemini-calls.jsonl || true
          git diff --cached --quiet && exit 0
          git commit -q -m "viral study: how the most-viewed short videos are made [skip ci]"
          for n in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((n * 20)); done
          exit 1
