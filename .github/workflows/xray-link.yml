name: xray-link

# X-ray of a YouTube video from its link, and of a channel from its handle (founder, 27 Nov 2026). Gemini watches from YouTube, so
# the 20 MB limit of the Telegram bots does not apply. Read-only: saves logs/xray/ and sends the breakdown to Telegram.
on:
  workflow_dispatch:
    inputs:
      video:
        description: 'YouTube link or video id'
        required: false
        default: ''
      channel:
        description: 'channel link or @handle'
        required: false
        default: ''
      note:
        description: 'what the founder wants looked at'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  xray:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Watch and break down
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO: ${{ github.event.inputs.video }}
          CHANNEL: ${{ github.event.inputs.channel }}
          NOTE: ${{ github.event.inputs.note }}
        run: python scripts/xray_link.py --video "$VIDEO" --channel "$CHANNEL" --note "$NOTE"
      - name: Save the X-ray
        if: always()
        run: |
          git config user.name "sg-content-bot"; git config user.email "sg-content-bot@users.noreply.github.com"
          git add -f logs/xray logs/gemini-calls.jsonl || true
          git diff --cached --quiet && exit 0
          git commit -q -m "X-ray from a link [skip ci]"
          for n in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((n * 20)); done
          exit 1
