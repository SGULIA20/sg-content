name: growth

# The founder's weekly growth report (22 Oct 2026): Play installs, countries and ratings for both apps from the read-only Play account,
# Waypoint's phase gates and each app's leading markets, on Telegram every Monday morning (Lagos). Sent once per week.
on:
  schedule:
    - cron: '13 8 * * 1'   # 09:13 Lagos
    - cron: '43 9 * * 1'   # second chance
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growth
  cancel-in-progress: false

jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build and send the weekly growth report
        env:
          PLAY_READER_KEY_B64: ${{ secrets.PLAY_READER_KEY_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.playreports --weekly --send
      - name: Remember that this week's report went out
        if: always()
        run: |
          git config user.name "sg-content-bot"
          git config user.email "sg-content-bot@users.noreply.github.com"
          git add -f logs/growth.json || true
          git diff --cached --quiet || git commit -m "growth: weekly report [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
