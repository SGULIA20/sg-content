name: preview-piece

# A preview of one Short in the new opening style, sent to the founder's Telegram; never uploaded, nothing committed (founder, 10 Nov 2026).
on:
  workflow_dispatch:
    inputs:
      piece:
        description: 'piece id, e.g. 2026-11-16-arthvan-short'
        required: true
      mode:
        description: 'video (default) = build the preview video; script = only write a trial script and intro prompt and send them; trailer = a sample of the suspense trailer Story of a long video'
        required: false
        default: 'video'
      pictures_from:
        description: 'trailer mode only: commit that holds the long video own pictures (out/<id>/visual*.png), so none is painted again'
        required: false
        default: ''
      lines:
        description: 'trailer mode only: the question lines as a JSON array, to build an approved sample again word for word'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - if: ${{ inputs.mode != 'script' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji
      - run: pip install -r requirements.txt
      - if: ${{ inputs.mode != 'script' }}
        run: python -m playwright install --with-deps chromium
      - name: Picture movement and cut-out tools
        if: ${{ inputs.mode != 'script' && inputs.mode != 'trailer' }}
        run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q transformers opencv-python-headless rembg onnxruntime
      - name: Write a trial script (nothing saved)
        if: ${{ inputs.mode == 'script' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/trial_script.py "${{ inputs.piece }}"
      - name: A sample of the long video's suspense trailer Story (sent to Telegram, nothing posted)
        if: ${{ inputs.mode == 'trailer' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRAILER_PICTURES_FROM: ${{ inputs.pictures_from }}
          TRAILER_LINES: ${{ inputs.lines }}
        run: python scripts/trailer_sample.py "${{ inputs.piece }}" out/trailer-sample
      - name: Keep the sample trailer as a download
        if: ${{ inputs.mode == 'trailer' }}
        uses: actions/upload-artifact@v4
        with:
          name: trailer-sample
          path: out/trailer-sample/*/trailer.mp4
          retention-days: 3
      - name: Build the preview
        if: ${{ inputs.mode != 'script' && inputs.mode != 'trailer' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/preview_piece.py "${{ inputs.piece }}" out/preview
      - name: Send it to the founder
        if: ${{ inputs.mode != 'script' && inputs.mode != 'trailer' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from pathlib import Path; from engine import telegram; print(telegram.send_file(Path('out/preview/${{ inputs.piece }}/reel.mp4'), 'PREVIEW ${{ inputs.piece }} in the new style. Not uploaded. Tell Claude to approve it or what to change.'))"
