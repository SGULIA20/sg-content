# The founder's likeness, generated once per pose from the studio photos in assets/reference/ (spec §5). Each pose sends 3 references.
# Reference guide: 01 front neutral, 02 three-quarter smile, 03 front slight smile, 04 profile left, 05 profile right, 06 front wide eyes,
# 07 looking down smile, 08 head tilt smile, 09 laughing, 10 shocked, 11 shouting, 12 thinking hand on chin, 13 big grin, 14 rubbing eye,
# 15 full body standing, 16 back view, 17 waving, 18 jumping, 19 sitting cross-legged, 20 walking profile, 21 pointing at camera, 22 arms wide.
explaining_front:
  prompt: half-body, facing camera, open palm gesture as if explaining a point, calm confident expression
  refs: [founder-01.jpg, founder-03.jpg, founder-15.jpg]
