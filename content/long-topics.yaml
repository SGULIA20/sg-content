# Learning with SG: evergreen topics for the twice-weekly 12-minute illustrated money documentaries (Wed + Sun).
# Used in order, each once, then the rotation restarts. Shorts keep coming from the news feeds; longs come from here because a
# 12-minute story needs a subject people search for all year, not a headline. Every number still comes from the research step with a source.
- id: home-loan-double
  theme: loan
  title: "50 lakh ka ghar, 1 crore ka bill: 20 saal ki EMI mein bank kitna kamata hai"
  summary: "A family buys a flat on a 20-year home loan; the amortisation schedule shows interest front-loaded, the total paid roughly double the price, and what prepaying one extra EMI a year does. Explain EMI, principal, interest, prepayment, floating rate."
  hooks: ["50 lakh ka ghar, 1 crore kyun dete ho?", "Pehli 5 saal ki EMI mein ghar ka kitna hissa aapka hua?", "Saal mein ek extra EMI se kitne saal bachte hain?"]
- id: fd-vs-inflation
  theme: bank
  title: "Papa ki FD 20 saal mein kyun chhoti ho gayi: mehngai ka chhupa tax"
  summary: "Fixed deposit interest vs inflation over two decades; real return, tax on FD interest, why the 'safe' choice quietly shrinks; where it still makes sense (emergency fund, short goals)."
  hooks: ["7% byaaj, phir bhi paisa kam kaise hua?", "FD par tax kab kat-ta hai?", "Emergency fund kahan rakhein?"]
- id: credit-card-minimum-due
  theme: loan
  title: "Credit card ka 'minimum due' button: 40,000 ka bill 4 saal kaise chalta hai"
  summary: "What happens when a cardholder pays only the minimum due: the interest-free period ends, interest of 36-42% a year compounds on the whole balance, late fees; how long a bill takes to clear paying minimum only; how to escape (pay in full, convert to EMI, balance transfer)."
  hooks: ["Minimum due bharne par kitna byaaj lagta hai?", "Bill 4 saal kyun nahi khatam hota?", "Card ka byaaj loan se zyada kyun?"]
- id: sip-rupee-cost
  theme: market
  title: "500 rupaye mahine ki SIP: 20 saal mein kya bana, aur kya nahi bana"
  summary: "How a monthly SIP in a mutual fund works, rupee cost averaging, the difference between returns in a good decade and a flat one, expense ratio, why stopping in a crash hurts; honest ranges, no promises."
  hooks: ["500 ki SIP se kya hoga?", "Market girne par SIP band karna sahi hai?", "Expense ratio kya khata hai?"]
- id: gold-vs-paper-gold
  theme: gold
  title: "Mummy ka sona vs sovereign gold bond: kaun sa gold sach mein kamata hai"
  summary: "Physical gold (making charges, purity, locker), gold ETFs and sovereign gold bonds compared over a decade: costs, 2.5% SGB interest, tax at maturity, when jewellery is a purchase not an investment."
  hooks: ["Gehne par making charge kitna jaata hai?", "Gold bond par 2.5% extra kaise milta hai?", "Locker ka kharcha kaun ginta hai?"]
- id: health-insurance-claim
  theme: insurance
  title: "Hospital ke bill par 'claim reject': health insurance ka chhota print"
  summary: "A family's hospital claim gets cut: room-rent limits, waiting periods, sub-limits, pre-existing disease rules, co-pay; how to read a policy, cashless vs reimbursement, why an employer policy alone is not enough."
  hooks: ["Room rent limit se poora claim kat-ta hai?", "Waiting period mein kya nahi milta?", "Office ka insurance kaafi hai?"]
- id: upi-fraud-anatomy
  theme: scam
  title: "UPI par 'refund' ka call: ek fraud ki poori kahani, step by step"
  summary: "How common UPI and OTP frauds work (collect requests, screen-share apps, fake customer care), what the money trail looks like, the RBI zero-liability rules and the 1930 helpline, what to do in the first hour."
  hooks: ["Refund lene ke liye PIN kyun maanga?", "Paisa gaya toh 1930 par kya hota hai?", "Bank kab paisa wapas deta hai?"]
- id: income-tax-regimes
  theme: tax
  title: "Purana ya naya tax regime: 10 lakh salary par kaun sa jeb bachaata hai"
  summary: "The two income tax regimes explained with one salaried family: slabs, standard deduction, 80C/HRA under the old regime, when each wins, how to switch; numbers from the current Finance Act."
  hooks: ["Naya regime sabke liye sasta hai?", "80C ab kaam ka hai ya nahi?", "HRA kab kaam aata hai?"]
- id: emergency-fund-six-months
  theme: jobs
  title: "Naukri gayi, EMI nahi ruki: 6 mahine ka emergency fund kaise banta hai"
  summary: "Why six months of expenses in a liquid place matters, where to keep it (savings, sweep FD, liquid fund), how a family builds it in a year, what not to touch it for."
  hooks: ["Emergency fund kitna hona chahiye?", "Savings account mein rakhna galat hai?", "Pehle loan chukayein ya fund banayein?"]
- id: car-loan-vs-cash
  theme: loan
  title: "10 lakh ki gaadi: loan par lein ya cash, aur 5 saal mein asli kharcha kya"
  summary: "Total cost of car ownership: loan interest, depreciation, insurance, fuel, service; the loan-vs-cash decision with opportunity cost, why a used car can be the smarter maths for many families."
  hooks: ["Gaadi 5 saal mein kitni sasti ho jaati hai?", "Car loan ka byaaj kitna dete hain?", "Cash hai toh bhi loan lena sahi hai?"]
# 11 Nov 2026: the ten topics above were all used and the rotation restarted on the first one, so the 16 Nov long came out on the same
# subject as the 21 Nov long (home loan). Fourteen more, each with a theme (engine/themes.py).
- id: rent-vs-buy
  theme: prices
  title: "Kiraye par rahein ya ghar khareedein: 20 saal ka poora hisaab"
  summary: "Renting against buying the same flat over 20 years: rent rises, EMI, down payment, maintenance, property tax, and what the saved difference becomes if it is kept aside. When buying wins, when renting wins, and the questions a family should ask before deciding."
  hooks: ["30,000 kiraya ya 60,000 EMI: 20 saal baad kaun aage?", "Down payment ka paisa ghar mein lagana sahi hai?", "Kiraya dena paisa barbaad karna hai?"]
- id: term-vs-endowment
  theme: insurance
  title: "1 crore ka term plan ya 'paisa wapas' policy: ek hi premium, do alag nateeje"
  summary: "Term insurance against endowment and money-back policies: what the family gets if the earner dies, what the policyholder gets at maturity, the real yearly return of a traditional policy, surrender value in the early years. How much cover a family needs."
  hooks: ["Paisa wapas wali policy mein asli return kitna hai?", "Term plan mein kuch wapas nahi milta, phir bhi sahi kyun?", "Kitne ka cover lena chahiye?"]
- id: credit-score-explained
  theme: loan
  title: "CIBIL score 650 se 780: ek number jo aapke loan ka byaaj tay karta hai"
  summary: "How a credit score is built: payment history, card usage, loan mix, enquiries; what a late EMI does and for how long; how to read the free yearly report and dispute an error; what the score changes on a home loan's rate in rupees."
  hooks: ["Ek EMI late hui, score kitna girta hai?", "Credit card band karne se score badhta hai ya girta hai?", "Score ka fark home loan par kitne lakh ka hai?"]
- id: gold-loan-vs-personal-loan
  theme: gold
  title: "Paise ki zaroorat: zevar girvi rakhein ya personal loan lein"
  summary: "Gold loan against personal loan for a sudden need: interest, processing fees, repayment styles, what happens on default (auction against a hit to the credit score), and the RBI limits on how much is lent against gold. A worked example of two lakh for one year."
  hooks: ["Gold loan sasta kyun hota hai?", "Kisht chhooti toh zevar kab neelam hota hai?", "2 lakh ek saal ke liye: kaun sa loan kitne ka padega?"]
- id: senior-savings-schemes
  theme: bank
  title: "Retire hone par 30 lakh kahan rakhein: SCSS, post office, FD ka seedha muqabla"
  summary: "The Senior Citizen Savings Scheme, post office monthly income scheme, bank FDs and RBI floating bonds: rates, limits, lock-in, tax on the interest and TDS, and how a retired couple can ladder them for a monthly income."
  hooks: ["30 lakh se mahine ka kitna aa sakta hai?", "SCSS mein kitna paisa rakh sakte hain?", "Byaaj par tax kat-ta hai toh kya karein?"]
- id: nps-explained
  theme: jobs
  title: "NPS: 60 ke baad kitni pension, aur paisa kab haath mein aata hai"
  summary: "The National Pension System for a salaried or self-employed person: the tax deduction, where the money is invested, what can be taken out at 60 and what must buy an annuity, and what monthly pension different savings give. Against PPF and EPF."
  hooks: ["5,000 mahine se 60 par kitni pension banti hai?", "NPS ka poora paisa ek saath kyun nahi milta?", "NPS, PPF ya EPF: retirement ke liye kaun sa?"]
- id: first-salary-plan
  theme: jobs
  title: "Pehli salary 40,000: mahine ke aakhir mein zero kyun, aur ise kaise rokein"
  summary: "A first-job budget: needs, wants and savings, the order to build things in (emergency fund, health cover, then investing), salary-slip lines explained (basic, HRA, PF, professional tax), and the common first-year mistakes with cards and EMIs."
  hooks: ["Salary slip mein PF ka paisa kiska hai?", "Pehle saal mein sabse badi galti kya hoti hai?", "40,000 mein kitna bachana sahi hai?"]
- id: buy-now-pay-later-trap
  theme: loan
  title: "'No cost EMI' sach mein muft hai? Phone ki kisht ka chhupa hisaab"
  summary: "How no-cost EMI and buy-now-pay-later work: the discount given up, processing fees and GST on interest, late fees, and what several small EMIs do to a credit report. When it is harmless and when it is a trap."
  hooks: ["No cost EMI mein cost kahan chhupi hai?", "Teen chhoti EMI se score par kya asar?", "Late hone par kitna jurmana lagta hai?"]
- id: health-cover-top-up
  theme: insurance
  title: "5 lakh ka health cover kam pad gaya: top-up plan kya hota hai"
  summary: "Why a base health policy runs out, how a super top-up works with a deductible, the cost of a higher base cover against base plus top-up, employer cover against one's own, and the waiting periods to know before a claim."
  hooks: ["Company ka insurance hai, phir apna kyun lein?", "Top-up plan itna sasta kyun hota hai?", "Deductible ka matlab kya hai?"]
- id: will-and-nominee
  theme: bank
  title: "Nominee malik nahi hota: papa ke account ka paisa kise milta hai"
  summary: "Nominee against legal heir for bank accounts, FDs, mutual funds, insurance and property; what happens when there is no will; how a simple will is written and registered; the unclaimed deposits lying with the RBI fund and how families claim them."
  hooks: ["Nominee aur waaris mein fark kya hai?", "Bina will ke paisa kise jaata hai?", "Banks mein hazaaron crore unclaimed kyun pade hain?"]
- id: child-education-fund
  theme: prices
  title: "Aaj 10 lakh ki degree 15 saal baad kitne ki: bachche ki padhai ka fund"
