# Learning with SG: money history and sensation bank (founder, 6 Nov 2026: "add war, attacks of the last 40-45 years, sensational
# news; stop repeating SIP, gold, oil"). Every other daily Short takes its topic from here (engine/topics.py next_money_history),
# in order, each once; the news feeds keep the other days. The research step finds and checks every number with a source; titles
# carry none on purpose. Every story ends on the viewer's wallet: what it did to prices, EMIs, jobs, savings, and the lesson.
# Avoided on purpose: party politics, named politicians, neighbouring-country names (content/banned.yaml), communal angles.
# 11 Nov 2026 (founder: "why only SIP, Sensex? ... viewers will feel bored"): every topic carries a theme (engine/themes.py); a theme
# waits 3 days before it comes again (share market / SIP: 7 days), Shorts and longs counted together. The three "tension and the
# Sensex" stories are one topic now, and the everyday-money topics at the end were added so that the list is no longer half share market.
- {id: mh-1991-gold-pledge, theme: gold, category: crisis, title: "1991: jab India ne apna sona videsh bheja", summary: "The 1991 balance-of-payments crisis: foreign exchange for barely two weeks of imports, RBI gold flown to London and Switzerland as collateral, the devaluation and the reforms that followed. What it did to prices and why today's forex reserves matter to a family.", hooks: ["1991 mein India ka sona plane se London kyun gaya?", "Sirf do hafte ka import ka paisa bacha tha, phir kya hua?"]}
- {id: mh-1992-harshad-mehta, theme: scam, category: scam, title: "1992: ek broker ne poora market hila diya", summary: "The 1992 securities scam: bank receipts, money moved from banks into shares, the Sensex run-up and the crash when it broke; what changed after (SEBI's teeth, depositories, settlement). The lesson for anyone chasing a 'sure' stock today.", hooks: ["1992 mein Sensex pehle kyun uda, phir kyun gira?", "Bank ka paisa share market tak kaise pahuncha?"]}
- {id: mh-2001-ketan-parekh, theme: scam, category: scam, title: "2001: K-10 shares aur ek bank ka girna", summary: "The Ketan Parekh episode: a handful of 'K-10' tech stocks pumped with bank and cooperative-bank money, the 2001 crash, and the cooperative bank that went down with it. Why a stock everyone is buying is the one to question.", hooks: ["Jo share sab khareed rahe the, woh raaton raat kyun gira?", "Ek bank depositors ka paisa share market mein kaise gaya?"]}
- {id: mh-2001-911-it, theme: jobs, category: attack, title: "9/11 ke baad Indian IT ki naukriyan", summary: "The attacks of September 2001 and what followed for Indian IT and BPO: the slowdown, then the outsourcing boom as US firms cut costs. How a shock abroad reshaped Bengaluru and Hyderabad salaries, with published employment numbers.", hooks: ["Amreeka par hamla, Bengaluru mein naukriyan kyun badhi?", "2001 ke baad call-centre boom kaise aaya?"]}
- {id: mh-2004-sensex-circuit, theme: market, category: crash, title: "Ek din mein market band: 2004 ka lower circuit", summary: "17 May 2004: the Sensex fell so fast that trading was halted twice; why it happened, who sold, and how it recovered within weeks. Circuit breakers explained, and what a lower circuit means for an ordinary investor's orders.", hooks: ["Share market ko ek din ke liye band kyun karna pada?", "Circuit lagne par aapka order kahan jaata hai?"]}
