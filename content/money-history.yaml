# Learning with SG: money history and sensation bank (founder, 6 Nov 2026: "add war, attacks of the last 40-45 years, sensational
# news; stop repeating SIP, gold, oil"). Every other daily Short takes its topic from here (engine/topics.py next_money_history),
# in order, each once; the news feeds keep the other days. The research step finds and checks every number with a source; titles
# carry none on purpose. Every story ends on the viewer's wallet: what it did to prices, EMIs, jobs, savings, and the lesson.
# Avoided on purpose: party politics, named politicians, neighbouring-country names (content/banned.yaml), communal angles.
- {id: mh-1991-gold-pledge, category: crisis, title: "1991: jab India ne apna sona videsh bheja", summary: "The 1991 balance-of-payments crisis: foreign exchange for barely two weeks of imports, RBI gold flown to London and Switzerland as collateral, the devaluation and the reforms that followed. What it did to prices and why today's forex reserves matter to a family.", hooks: ["1991 mein India ka sona plane se London kyun gaya?", "Sirf do hafte ka import ka paisa bacha tha, phir kya hua?"]}
- {id: mh-1992-harshad-mehta, category: scam, title: "1992: ek broker ne poora market hila diya", summary: "The 1992 securities scam: bank receipts, money moved from banks into shares, the Sensex run-up and the crash when it broke; what changed after (SEBI's teeth, depositories, settlement). The lesson for anyone chasing a 'sure' stock today.", hooks: ["1992 mein Sensex pehle kyun uda, phir kyun gira?", "Bank ka paisa share market tak kaise pahuncha?"]}
- {id: mh-1999-kargil-market, category: war, title: "Kargil ke waqt Sensex ne kya kiya", summary: "May to July 1999: the Kargil conflict and the Indian stock market. What the Sensex did during the fighting and after it ended, and what the pattern of markets during Indian conflicts (1999, 2019, 2025) says about panic-selling. Numbers from exchange data only; no cross-border names.", hooks: ["Jung ke waqt share market girta hai ya chadhta hai?", "Kargil ke do mahine mein Sensex kahan gaya?"]}
- {id: mh-2001-ketan-parekh, category: scam, title: "2001: K-10 shares aur ek bank ka girna", summary: "The Ketan Parekh episode: a handful of 'K-10' tech stocks pumped with bank and cooperative-bank money, the 2001 crash, and the cooperative bank that went down with it. Why a stock everyone is buying is the one to question.", hooks: ["Jo share sab khareed rahe the, woh raaton raat kyun gira?", "Ek bank depositors ka paisa share market mein kaise gaya?"]}
- {id: mh-2001-911-it, category: attack, title: "9/11 ke baad Indian IT ki naukriyan", summary: "The attacks of September 2001 and what followed for Indian IT and BPO: the slowdown, then the outsourcing boom as US firms cut costs. How a shock abroad reshaped Bengaluru and Hyderabad salaries, with published employment numbers.", hooks: ["Amreeka par hamla, Bengaluru mein naukriyan kyun badhi?", "2001 ke baad call-centre boom kaise aaya?"]}
- {id: mh-2004-sensex-circuit, category: crash, title: "Ek din mein market band: 2004 ka lower circuit", summary: "17 May 2004: the Sensex fell so fast that trading was halted twice; why it happened, who sold, and how it recovered within weeks. Circuit breakers explained, and what a lower circuit means for an ordinary investor's orders.", hooks: ["Share market ko ek din ke liye band kyun karna pada?", "Circuit lagne par aapka order kahan jaata hai?"]}
- {id: mh-2008-lehman-india, category: crisis, title: "2008: Amreeka ka bank dooba, aapki SIP par kya beeta", summary: "The global financial crisis as seen from India: the Sensex from 21,000 to 8,000, FIIs pulling out, the IT and realty job scare, and how a SIP that kept running from 2008 to 2010 came out. Published index data and fund returns only.", hooks: ["2008 mein Sensex aadha ho gaya, phir kitne mahine mein wapas aaya?", "Jo SIP 2008 mein band nahi hui, uska kya hua?"]}
- {id: mh-2008-mumbai-attack-market, category: attack, title: "26/11 ke baad agle din market khula tha?", summary: "The November 2008 Mumbai attacks and the exchanges: when trading resumed, what the Sensex did that week, and why markets often shrug off terror while crashing on credit. Respectful tone; numbers from exchange records; no speculation about the attackers.", hooks: ["26/11 ke baad Sensex kab khula, aur kya hua?", "Aatank ka market par asar itna kam kyun?"]}
- {id: mh-2009-satyam, category: scam, title: "Satyam: 7,000 crore ka cash jo tha hi nahi", summary: "January 2009: the Satyam chairman's letter admitting fake cash on the books, the share collapse, how auditors missed it, and the government-led rescue into Tech Mahindra. How to read a balance sheet's cash line before trusting a company.", hooks: ["Company ke khaate mein 7,000 crore likha tha, bank mein kuch nahi?", "Satyam ke 50,000 employees ka kya hua?"]}
- {id: mh-2010-coal-2g-markets, category: scandal, title: "2G aur coal: license radd hua, kiska paisa dooba", summary: "The 2G spectrum and coal block cancellations by the Supreme Court (2012, 2014): what happened to the companies, their lenders and their shareholders. Keep to court orders, company filings and bank disclosures; no party politics.", hooks: ["License radd hone par shareholder ka paisa kahan gaya?", "Banks ko 2G se kitna nuksaan hua?"]}
- {id: mh-2013-taper-tantrum, category: crisis, title: "2013: rupaya 68 ke paar kyun gaya", summary: "The 2013 taper tantrum: the US Fed's hint, dollars leaving India, the rupee's fall to a record, the RBI's gold-import curbs and the NRI deposit scheme that calmed it. Why the rupee moves when America sneezes, and what it does to petrol and phone prices.", hooks: ["Amreeka ne ek baat kahi, rupaya 15% kyun gira?", "2013 mein sone par import duty kyun badhi?"]}
- {id: mh-2013-nsel, category: scam, title: "NSEL: 5,600 crore ka exchange jo raaton raat ruk gaya", summary: "The 2013 NSEL payment crisis: 'paired contracts' promising fixed returns on goods that did not exist in the warehouses, 13,000 investors stuck. The tell-tale sign of a guaranteed return.", hooks: ["Fixed return wala commodity deal, maal godaam mein tha hi nahi?", "13,000 investors ka paisa 10 saal se kyun atka hai?"]}
- {id: mh-2014-sahara-saradha, category: scam, title: "Sahara aur Saradha: chit fund ka paisa gaya kahan", summary: "Two collective-investment collapses: Sahara's bonds ordered refunded by the Supreme Court, Saradha in Bengal where lakhs of small savers lost deposits. How such schemes recruit, why the refund is still running, and the one check before handing cash to an agent.", hooks: ["Agent ne daily 50 rupaye liye, paisa kab doobta hai?", "Court ne refund ka order diya, phir bhi paisa kyun nahi mila?"]}
- {id: mh-2016-demonetisation, category: policy, title: "8 November 2016: raat 8 baje se 500 ka note kaagaz", summary: "The 2016 note withdrawal: the queue months, the cash crunch in small shops, what RBI's final count of returned notes showed, and the digital-payments shift that followed. What a family learned about keeping some cash and some digital.", hooks: ["Raat 8 baje ke baad 500 ka note kya ban gaya?", "RBI ke hisaab se kitna paisa wapas aaya?"]}
- {id: mh-2016-jio-price-war, category: sensation, title: "Jio ka free data: baaki companies ka kya hua", summary: "September 2016: free data for months, the price war, Vodafone and Idea merging, Aircel and RCom going down, and what data costs per GB before and after. The economics of a price war and who pays in the end.", hooks: ["Free data se Jio ne paisa kaise banaya?", "2016 mein 1 GB ka daam kitna tha, aaj kitna?"]}
- {id: mh-2018-pnb-nirav, category: scam, title: "PNB ka 13,000 crore: ek letter se bank kaise loota", summary: "The 2018 PNB fraud: letters of undertaking issued without entries in the core banking system, foreign branches lending against them, the jeweller who left the country. How a public bank's controls failed and what it meant for the bank's depositors and shareholders.", hooks: ["Ek bank branch se 13,000 crore bahar kaise gaye?", "LoU kya hota hai, aur usne bank ko kaise dubaya?"]}
- {id: mh-2018-ilfs, category: crisis, title: "IL&FS: AAA rating wali company ka default", summary: "September 2018: IL&FS, rated AAA weeks earlier, misses payments; the NBFC liquidity squeeze, mutual funds with its paper, and the lesson that a top rating is a snapshot, not a promise. How to read what your debt fund holds.", hooks: ["AAA rating wali company default kaise kar gayi?", "Aapke debt fund mein IL&FS ka paper tha?"]}
- {id: mh-2019-balakot-market, category: war, title: "Sarhad par tanav, market mein kya hota hai", summary: "February 2019: air strikes and the days that followed on the exchanges; the dip, the recovery, and the broader pattern of Indian markets in the weeks around armed tension (1999, 2019, 2025). Exchange data only; no country names beyond India.", hooks: ["Tanav ki khabar par pehle din market kitna gira?", "Do hafte baad Sensex kahan tha?"]}
- {id: mh-2020-yes-bank, category: crisis, title: "Yes Bank: ek raat mein ATM se sirf 50,000", summary: "March 2020: the moratorium on Yes Bank, withdrawals capped, UPI apps on its rails stuck, the SBI-led rescue, and the AT1 bonds written to zero. What deposit insurance covers, and why a high FD rate deserves a second look.", hooks: ["Bank par moratorium laga toh aapka paisa kitna nikal sakta hai?", "Yes Bank ke AT1 bond holders ka paisa zero kaise hua?"]}
- {id: mh-2020-covid-crash, category: crash, title: "March 2020: 23% ek mahine mein, phir sabse badi recovery", summary: "The COVID crash: the Sensex's worst month, the lower circuit day of 23 March, then the fastest bull run as new investors opened crores of demat accounts. What the people who sold at the bottom missed, with index data.", hooks: ["23 March 2020 ko Sensex kitna gira tha?", "Lockdown mein demat account kyun badhe?"]}
- {id: mh-2021-paytm-ipo, category: sensation, title: "India ka sabse bada IPO, pehle din 27% neeche", summary: "The Paytm IPO of November 2021: the largest Indian IPO, the listing-day fall, and what happened to retail investors who bought the hype. How IPO pricing works and the questions to ask before applying.", hooks: ["Sabse bade IPO mein paisa lagane walon ka pehle din kya hua?", "IPO ka daam kaun tay karta hai?"]}
- {id: mh-2022-ukraine-oil, category: war, title: "Europe ki jung, India ke kitchen ka tel", summary: "February 2022 onward: the war in Europe, crude above 100 dollars, sunflower oil disappearing from Indian shelves, wheat export curbs, and the RBI rate hikes that lifted EMIs. How a war far away reaches an Indian grocery bill.", hooks: ["Europe mein jung, India mein sunflower oil kyun gayab hua?", "2022 mein EMI kyun badhi?"]}
- {id: mh-2022-adani-hindenburg, category: sensation, title: "Ek report aur 10 lakh crore ka market value", summary: "January 2023: a short-seller's report on the Adani group, the share falls, the LIC and bank exposure questions, and the Supreme Court panel. What a short-seller is, and how a retail investor should read allegations.", hooks: ["Ek PDF report se 10 lakh crore kaise ude?", "Short seller paisa kaise kamata hai?"]}
- {id: mh-2023-2000-note, category: policy, title: "2,000 ka note phir se bahar: is baar kya alag tha", summary: "May 2023: the 2,000 rupee note withdrawn from circulation, how it differed from 2016, how much came back, and the small-shop confusion. What 'legal tender' means and why RBI prints a note at all.", hooks: ["2,000 ka note band hua, par 2016 jaisa kyun nahi laga?", "Note wapas lene par RBI ko fayda ya nuksaan?"]}
- {id: mh-2023-byjus, category: sensation, title: "22 billion dollar ki company zero kaise hui", summary: "Byju's: from the most valuable Indian startup to insolvency; the unpaid loan, the auditors leaving, the parents who paid for courses through EMIs. How a valuation is made and unmade, and what a parent should check before an education loan for a course.", hooks: ["Duniya ki sabse mehngi edtech company doobi kaise?", "Course ke liye EMI, company band ho jaaye toh?"]}
- {id: mh-2024-june-crash, category: crash, title: "Ek din mein 6% gira, agle din 3% chadha", summary: "4 June 2024: the biggest one-day fall in four years and the bounce the next day; what exit-poll bets, FII flows and retail panic did, from exchange data. No party politics: only what prices did and what panic cost.", hooks: ["Ek din mein 30 lakh crore kaise gaye, phir wapas kaise aaye?", "Us din bechne walon ne kitna khoya?"]}
- {id: mh-2024-hindenburg-sebi, category: sensation, title: "SEBI chief par aarop: market ne kya kiya", summary: "August 2024: allegations against the market regulator's chief, the response, and how the market reacted compared with January 2023. What a regulator does for a small investor, in plain words.", hooks: ["Regulator par sawaal uthe toh market kyun nahi gira?", "SEBI aapke paise ke liye kya karti hai?"]}
- {id: mh-2025-may-conflict-market, category: war, title: "May 2025: sarhad par tanav aur Sensex ka hafta", summary: "The May 2025 cross-border tension week: the defence-stock jump, the broad market dip and recovery, oil and the rupee; what the pattern since 1999 says about selling in fear. Exchange and RBI data only; no neighbour named.", hooks: ["Tanav ke hafte mein defence shares kyun ude?", "Dar ke mare bechne wale ne kya khoya?"]}
- {id: mh-petrol-1980-today, category: price-history, title: "1980 mein petrol 5 rupaye, aaj 100: asli kahani", summary: "Petrol in rupees per litre from 1980 to today, what part is crude, what part is tax, and what a litre cost in hours of an average wage then and now. Published price and tax tables only.", hooks: ["1980 mein ek litre petrol kitne ka tha?", "Petrol ke 100 rupaye mein tax kitna hai?"]}
- {id: mh-gold-1980-today, category: price-history, title: "Dadi ne 1980 mein 10 gram sona 1,300 mein liya", summary: "Gold's rupee price per 10 grams from 1980 to today against inflation and the Sensex: which saved a family more, and in which decades. Not a tip: a comparison with published prices.", hooks: ["1980 ka sona ya 1980 ka Sensex, kaun jeeta?", "Dadi ka sona mehngai se jeeta ya haara?"]}
- {id: mh-salary-1990-today, category: price-history, title: "1990 ki 3,000 ki salary aaj kitni hogi", summary: "What a clerk, an engineer and a teacher earned in 1990, 2005 and today, against the cost of a scooter, a flat and a month's groceries. Purchasing power explained with published wage and price data.", hooks: ["1990 ki salary se scooter kitne mahine mein aata tha?", "Aaj ki salary 1990 ke hisaab se kitni hai?"]}
- {id: mh-maruti-800-price, category: price-history, title: "1983 mein Maruti 800 ka daam, aaj ki car se compare", summary: "The Maruti 800 launch price in 1983, the waiting list, and what the same money buys today; why car prices rose slower than houses. A story of one family's first car.", hooks: ["1983 mein Maruti 800 kitne ki thi?", "Car sasti hui ya ghar mehnga?"]}
- {id: mh-upi-birth, category: policy, title: "UPI kaise bana: 2016 se 1,500 crore transactions tak", summary: "How UPI was built, the 2016 launch, the free-for-users decision, the merchant-fee debate and what it did to cash and to small shops. Published NPCI volume numbers.", hooks: ["UPI free kaise hai, kharcha kaun deta hai?", "Ek mahine mein kitne UPI payment hote hain?"]}
- {id: mh-dotcom-india, category: crash, title: "2000 ka dotcom crash: Infosys ka share kahan gaya", summary: "The 2000 dotcom bust seen through Indian IT shares: the run-up, the fall, and the decade it took for some to recover. What a bubble looks like from inside, with index and share data.", hooks: ["2000 mein IT shares 80% kyun gire?", "Bubble ke andar se bubble kaisa dikhta hai?"]}
- {id: mh-1997-asian-crisis, category: crisis, title: "1997 Asia crisis: India bacha kaise", summary: "The 1997 East Asian crisis: currencies halving across the region while India, with a closed capital account, took a smaller hit. What capital controls are and why the rupee is still not fully convertible.", hooks: ["Asia ki currencies aadhi hui, rupaya kyun bacha?", "Rupaya poori tarah convertible kyun nahi hai?"]}
- {id: mh-kingfisher-mallya, category: sensation, title: "Kingfisher: airline doobi, banks ka 9,000 crore", summary: "The Kingfisher Airlines collapse: the losses, the bank consortium, the brand pledged as collateral, employees unpaid, and the owner's exit. What a loan default by a big borrower does to a bank and its depositors.", hooks: ["Airline doobi toh bank ka paisa kahan gaya?", "Brand ko girvi rakh kar loan kaise milta hai?"]}
- {id: mh-pmc-bank, category: crisis, title: "PMC Bank: 6 saal se paisa atka", summary: "2019: a cooperative bank hid loans to one builder, depositors capped at a few thousand rupees, and the long road to a merger. Why cooperative-bank deposits need a second look and what the insurance cover is.", hooks: ["Cooperative bank mein FD, kitna safe hai?", "PMC ke depositors ko paisa kab mila?"]}
- {id: mh-fin-crisis-1980s-bombay-mills, category: jobs, title: "1982: Bombay ki mill hadtaal aur 2 lakh naukriyan", summary: "The 1982 textile strike in Bombay, the mills that never reopened, what happened to the workers' families and to the land that became malls. A money lesson about an industry ending.", hooks: ["Ek hadtaal se 2 lakh naukriyan kaise gayi?", "Mill ki zameen par aaj kya hai?"]}
