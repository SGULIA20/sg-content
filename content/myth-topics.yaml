# SG-MYTH-WORLD topic bank: "Sabut ke saath" (spec §B). One long documentary per topic, three Shorts from its three hooks.
# allowed_sources: where the research step may take facts from (plus the scriptures named). Every claim is labelled
# scripture / archaeology / disputed / legend on screen. No communal content, no debunking of faith.
