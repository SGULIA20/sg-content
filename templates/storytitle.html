<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Dev;src:url({{FONTS}}/NotoSansDevanagari.ttf)}
@font-face{font-family:Inter;src:url({{FONTS}}/Inter.ttf)}
html,body{margin:0;padding:0;background:#000}
#root{position:relative;width:{{W}}px;height:{{H}}px;overflow:hidden;background:#000;font-family:Inter,Dev,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 60px;box-sizing:border-box;text-align:center}
.title{font-weight:800;font-size:72px;line-height:1.15;letter-spacing:-1px}
.title .k{color:#FFD166}
</style></head><body><div id="root"><div class="title">{{title_html}}</div></div>
<script>const t=document.querySelector(".title");let fs=72;while(t.scrollHeight>{{H}}-20&&fs>44){fs-=4;t.style.fontSize=fs+"px"}</script>
</body></html>
