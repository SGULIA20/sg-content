<!doctype html><html><head><meta charset="utf-8"><style>
/* 30 Oct 2026 (founder: "I want to automise this"): the Instagram Story that sends followers to each new long video. Instagram's API
   cannot add a link sticker, so the card points to the YouTube link in the bio. Content kept inside the middle, clear of Instagram's
   top bar and bottom reply box. */
@font-face{font-family:Dev;src:url({{FONTS}}/NotoSansDevanagari.ttf)}
@font-face{font-family:Inter;src:url({{FONTS}}/Inter.ttf)}
html,body{margin:0;padding:0;background:#0B0F1A}
#root{position:relative;width:{{W}}px;height:{{H}}px;overflow:hidden;background:#0B0F1A;font-family:Inter,Dev,sans-serif;color:#fff;text-align:center}
.wrap{position:absolute;left:5%;right:5%;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:34px}
.logo{width:150px;height:150px}
.new{background:#E50914;color:#fff;font-weight:900;font-size:64px;padding:8px 28px;border-radius:12px;letter-spacing:1px;transform:rotate(-2deg)}
.thumb{width:100%;border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.6);border:4px solid #fff}
.title{font-weight:800;font-size:54px;line-height:1.2}
.k{color:#FFE14D}
.yt{font-weight:900;font-size:60px;color:#FFE14D}
.bio{font-weight:800;font-size:50px;color:#fff;background:rgba(255,255,255,.12);padding:16px 30px;border-radius:40px}
.ch{font-weight:700;font-size:36px;color:#9AA4BF}
</style></head><body><div id="root"><div class="wrap">
  <img class="logo" src="{{logo_path}}">
  <div class="new">NAYA VIDEO</div>
  <img class="thumb" src="{{thumb_path}}">
  <div class="title">{{title_html}}</div>
  <div class="yt">Poora video YouTube par</div>
  <div class="bio">👆 Link bio mein</div>
  <div class="ch">{{channel}} · {{handle}}</div>
</div></div></body></html>
