<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url({{FONTS}}/Inter.ttf)}
@font-face{font-family:Dev;src:url({{FONTS}}/NotoSansDevanagari.ttf)}
html,body{margin:0;padding:0;background:transparent}
#root{position:relative;width:{{W}}px;height:{{H}}px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding:0 60px 40px;box-sizing:border-box;text-align:center}
.cap{font-family:Inter,Dev,sans-serif;font-weight:900;font-size:78px;line-height:1.15;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 6px 18px rgba(0,0,0,.6)}
.cap b{color:#FFD400;font-weight:900}
</style></head><body><div id="root"><div class="cap">{{text_html}}</div></div>
<script>const t=document.querySelector(".cap");let fs=78;while(t.scrollHeight>{{H}}-50&&fs>48){fs-=4;t.style.fontSize=fs+"px"}</script>
</body></html>
