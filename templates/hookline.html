<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url({{FONTS}}/Inter.ttf)}
@font-face{font-family:Dev;src:url({{FONTS}}/NotoSansDevanagari.ttf)}
html,body{margin:0;padding:0;background:transparent}
#root{position:relative;width:{{W}}px;height:{{H}}px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0 110px;box-sizing:border-box;text-align:center}
.h{font-family:Inter,Dev,sans-serif;font-weight:900;font-size:96px;line-height:1.1;color:#fff;-webkit-text-stroke:4px #000;paint-order:stroke fill;text-shadow:0 8px 24px rgba(0,0,0,.75)}
.h .k{color:#FFD400}
</style></head><body><div id="root"><div class="h">{{title_html}}</div></div>
<script>const t=document.querySelector(".h");let fs=96;while(t.scrollHeight>{{H}}-20&&fs>56){fs-=4;t.style.fontSize=fs+"px"}</script>
</body></html>
