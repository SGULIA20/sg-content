<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0B0F1A}
#root{position:relative;width:{{W}}px;height:{{H}}px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#15213B 0,#0B0F1A 70%);display:flex;align-items:flex-start;justify-content:center}
.avatar{margin-top:7%;height:60%;border-radius:36px;object-fit:cover;box-shadow:0 30px 80px rgba(0,0,0,.6)}
</style></head><body><div id="root"><img class="avatar" src="{{avatar_path}}" onerror="this.style.display='none'"></div></body></html>
