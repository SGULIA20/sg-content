<!doctype html><html><head><meta charset="utf-8"><style>
/* 2 Nov 2026 (founder: make the Claude-drawn Reels as gripping as the motion Reels that work): the news card, moving every second.
   seek(t) draws the frame at t seconds, so the video is rendered frame by frame and never depends on timers. Same look as newscard. */
@font-face{font-family:Dev;src:url({{FONTS}}/NotoSansDevanagari.ttf)}
@font-face{font-family:Inter;src:url({{FONTS}}/Inter.ttf)}
html,body{margin:0;padding:0;background:#0B0F1A}
#root{position:relative;width:{{W}}px;height:{{H}}px;overflow:hidden;font-family:Inter,Dev,sans-serif;color:#fff;text-align:center;
      background:radial-gradient(ellipse at 50% 26%,{{glow}} 0,#0B0F1A 62%);perspective:1600px}
.grid{position:absolute;inset:-180px;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:90px 90px}
.steps{position:absolute;left:150px;right:150px;top:46px;height:60px}
.track{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
.fill{position:absolute;left:0;top:14px;height:6px;border-radius:3px;background:{{accent}};width:0}
.dot{position:absolute;top:6px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#2A3146;border:3px solid #0B0F1A}
.dot.on{background:{{accent}}}
.steplbl{position:absolute;top:40px;font:700 26px Inter,Dev,sans-serif;letter-spacing:2px;color:{{accent}};text-transform:uppercase;transform:translateX(-50%);white-space:nowrap}
.wrap{position:absolute;left:150px;right:150px;top:150px;display:flex;flex-direction:column;align-items:center;gap:24px;transform-style:preserve-3d;transform-origin:50% 0}
.tag{font-weight:900;font-size:44px;letter-spacing:3px;padding:10px 28px;border-radius:12px;background:{{accent}};color:#000;text-transform:uppercase}
.tag:empty{display:none}
.cube{width:240px;height:240px;border-radius:40px;display:flex;align-items:center;justify-content:center;font-size:150px;
      background:linear-gradient(145deg,{{accent}},#1B2236 92%);box-shadow:0 40px 70px rgba(0,0,0,.55),inset 0 -14px 0 rgba(0,0,0,.25)}
.big{font-weight:900;font-size:140px;line-height:1;letter-spacing:-4px;color:#FFE14D;text-shadow:0 8px 0 #000}
.big:empty{display:none}
.line{font-weight:800;font-size:58px;line-height:1.15;max-width:100%}
.line .w{display:inline-block;margin:0 .14em;opacity:0;transform:translateY(30px)}
.pop{position:absolute;right:120px;top:39%;padding:12px 24px;border-radius:40px;background:#4ADE80;color:#00210D;font:900 34px Inter,Dev,sans-serif;opacity:0}
.pop:empty{display:none}
</style></head><body><div id="root"><div class="grid" id="grid"></div>
<div class="steps"><div class="track"></div><div class="fill" id="fill"></div><div id="dots"></div></div>
<div class="wrap" id="wrap">
  <div class="tag" id="tag">{{tag}}</div>
  <div class="cube" id="cube">{{icon}}</div>
  <div class="big" id="big">{{big_number}}</div>
  <div class="line" id="line">{{words}}</div>
</div>
<div class="pop" id="pop">{{pop}}</div>
</div>
<script>
const D={{D}}, I={{I}}, N={{N}}, LIMIT={{LIMIT}};
const big=document.getElementById("big"), BIG=big.textContent.trim();
if(BIG.length>7){big.style.fontSize=Math.max(86,Math.floor(1000/BIG.length))+"px"}
const words=[...document.querySelectorAll("#line .w")];
if(document.getElementById("line").textContent.trim().length>34){document.getElementById("line").style.fontSize="50px"}
const dots=document.getElementById("dots"), stepsW=document.querySelector(".steps").clientWidth;
for(let k=0;k<N;k++){const d=document.createElement("div");d.className="dot"+(k<=I?" on":"");d.style.left=(N>1?k*stepsW/(N-1):stepsW/2)+"px";dots.appendChild(d)}
const m=BIG.match(/^([^\d]*)(\d[\d,]*\.?\d*)(.*)$/), num=m?parseFloat(m[2].replace(/,/g,"")):null;
const dec=m&&m[2].includes(".")?m[2].split(".")[1].length:0;
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const back=x=>{x=Math.min(1,Math.max(0,x));const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function fmt(v){let s=v.toFixed(dec);if(m[2].includes(",")){const p=s.split(".");p[0]=Number(p[0]).toLocaleString("en-IN");s=p.join(".")}return m[1]+s+m[3]}
const wrapEl=document.getElementById("wrap");
let FIT=1;{const r=wrapEl.getBoundingClientRect();if(r.bottom>LIMIT){FIT=Math.max(0.55,(LIMIT-r.top)/r.height)}}
function seek(t){
  document.getElementById("grid").style.transform=`translate(${-(t*24)%90}px,${-(t*14)%90}px)`;
  const from=(N>1?(Math.max(I-1,0))/(N-1):0), to=(N>1?I/(N-1):1);
  document.getElementById("fill").style.width=((from+(to-from)*ease(t/0.6))*100)+"%";
  const tg=document.getElementById("tag"); tg.style.opacity=ease(t/0.25); tg.style.transform=`translateY(${(1-ease(t/0.25))*-40}px)`;
  const s=back(t/0.45), c=document.getElementById("cube");
  c.style.transform=`scale(${0.2+0.8*s}) rotateX(${12*Math.sin(t*1.6)}deg) rotateY(${-18+18*Math.sin(t*1.1)}deg)`;
  if(num!==null){big.textContent=fmt(num*ease((t-0.25)/0.9))} big.style.opacity=ease((t-0.2)/0.3);
  const span=Math.max(0.6,Math.min(D*0.7,words.length*0.32));
  words.forEach((w,k)=>{const a=ease((t-0.35-k*span/Math.max(words.length,1))/0.25);w.style.opacity=a;w.style.transform=`translateY(${(1-a)*30}px)`});
  const p=document.getElementById("pop"), pa=back((t-D*0.55)/0.35);
  p.style.opacity=Math.min(1,Math.max(0,(t-D*0.55)/0.15)); p.style.transform=`scale(${0.5+0.5*pa}) rotate(-6deg)`;
  wrapEl.style.transform=`translateY(${Math.sin(t*1.3)*8}px) scale(${FIT})`;
}
seek(0);
</script></body></html>
