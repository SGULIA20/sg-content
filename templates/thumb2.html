<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Dev;src:url({{FONTS}}/NotoSansDevanagari.ttf)}
@font-face{font-family:Inter;src:url({{FONTS}}/Inter.ttf)}
html,body{margin:0;padding:0;background:#0B0F1A}
#root{position:relative;width:{{W}}px;height:{{H}}px;overflow:hidden;background:#0B0F1A;font-family:Inter,Dev,sans-serif;color:#fff}
.panel{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{focus}}}
.shade{position:absolute;inset:0}
.words{position:absolute;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.w{display:block;white-space:nowrap;font-weight:900;line-height:1;letter-spacing:-2px;color:#FFD166;text-shadow:0 0 10px #000,4px 4px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000}
.w:nth-child(2){color:#fff}.w:nth-child(3){color:#FF4D4D}
/* portrait cover: full-bleed picture, words low (above Instagram's bottom UI, inside the grid crop) */
.portrait .shade{background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%)}
.portrait .words{left:5%;right:5%;bottom:17%}
/* landscape thumb: picture on the right, words on a dark left column, nothing over the face */
.landscape .panel{left:40%;width:60%}
.landscape .shade{background:linear-gradient(90deg,#0B0F1A 0%,#0B0F1A 38%,rgba(11,15,26,0) 52%)}
.landscape .words{left:4%;top:0;bottom:0;width:52%;justify-content:center}
.landscape .w{text-shadow:4px 4px 0 #000}
</style></head><body><div id="root">
<img class="panel" src="{{panel_path}}">
<div class="shade"></div>
<div class="words">{{words}}</div>
</div>
<script>
const root=document.getElementById("root"),W={{W}},H={{H}};
root.classList.add(H>W?"portrait":"landscape");
const ws=[...document.querySelectorAll(".w")],box=document.querySelector(".words");
let fs=Math.floor(H>W?W*0.15:H*0.26);
const fit=()=>ws.forEach(w=>{w.style.fontSize=fs+"px"});
fit();
const limit=H>W?W*0.92:W*0.44;   // landscape: words stay inside the dark left column, never over the face
const tall=()=>ws.reduce((a,w)=>a+w.offsetHeight,0)>H*0.9;
while(fs>60&&(Math.max(...ws.map(w=>w.offsetWidth))>limit||tall())){fs-=6;fit()}
</script>
</body></html>
