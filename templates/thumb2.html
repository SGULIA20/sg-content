<!doctype html><html><head><meta charset="utf-8"><style>
/* 27 Oct 2026 (founder: "see the difference between thumbnails of others and ours"): the click-winning layout of the big explainer
   channels. A dramatic full-bleed picture, the TOPIC NAME huge on a red banner, two or three shock words below it, a number in a
   yellow tag. Landscape (YouTube): text on the left, bottom-right kept clear for YouTube's time stamp. Portrait (Instagram cover,
   Shorts): text inside the middle 3:4 that the profile grid shows, above Instagram's bottom buttons. */
@font-face{font-family:Dev;src:url({{FONTS}}/NotoSansDevanagari.ttf)}
@font-face{font-family:Inter;src:url({{FONTS}}/Inter.ttf)}
html,body{margin:0;padding:0;background:#0B0F1A}
#root{position:relative;width:{{W}}px;height:{{H}}px;overflow:hidden;background:#0B0F1A;font-family:Inter,Dev,sans-serif;color:#fff}
.panel{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{focus}};filter:saturate(1.25) contrast(1.1)}
.shade{position:absolute;inset:0}
.text{position:absolute;display:flex;flex-direction:column;gap:14px}
.name{align-self:flex-start;background:#E50914;color:#fff;font-weight:900;line-height:1.05;padding:.06em .22em .1em;letter-spacing:-1px;
      white-space:nowrap;box-shadow:8px 8px 0 rgba(0,0,0,.85);transform:rotate(-2deg);transform-origin:left center}
.name:empty{display:none}
.words{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.w{display:block;white-space:nowrap;font-weight:900;line-height:1.02;letter-spacing:-2px;color:#FFE14D;
   -webkit-text-stroke:.07em #000;paint-order:stroke fill;text-shadow:0 6px 14px rgba(0,0,0,.9)}
.w:nth-child(2){color:#fff}.w:nth-child(3){color:#FFE14D}
.w.num{color:#000;background:#FFE14D;-webkit-text-stroke:0;text-shadow:none;padding:.02em .18em .06em;border-radius:.12em;box-shadow:6px 6px 0 #000}
.landscape .shade{background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,0) 65%),linear-gradient(0deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 40%)}
.landscape .text{left:4%;top:7%;bottom:8%;width:62%;justify-content:space-between}
.portrait .shade{background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 50%,rgba(0,0,0,.75) 85%)}
.portrait .text{left:6%;right:6%;top:15%;bottom:22%;justify-content:space-between;align-items:center}
.portrait .name{align-self:center;transform:rotate(-2deg);transform-origin:center}
.portrait .words{align-items:center}
</style></head><body><div id="root">
<img class="panel" src="{{panel_path}}">
<div class="shade"></div>
<div class="text"><div class="name">{{name}}</div><div class="words">{{words}}</div></div>
</div>
<script>
const root=document.getElementById("root"),W={{W}},H={{H}},tall=H>W;
root.classList.add(tall?"portrait":"landscape");
const name=document.querySelector(".name"),ws=[...document.querySelectorAll(".w")];
ws.forEach(w=>{if(/\d/.test(w.textContent))w.classList.add("num")});
// Biggest size that still fits: the name up to a third of the height, the words share what is left.
const maxW=tall?W*0.88:W*0.6;
let nf=Math.floor(tall?W*0.2:H*0.24);
name.style.fontSize=nf+"px";
while(nf>40&&name.offsetWidth>maxW){nf-=4;name.style.fontSize=nf+"px"}
let fs=Math.floor(tall?W*0.17:H*0.2);
const fit=()=>ws.forEach(w=>{w.style.fontSize=fs+"px"});
fit();
const room=()=>(tall?H*0.63:H*0.85)-name.offsetHeight-30;
while(fs>40&&(Math.max(0,...ws.map(w=>w.offsetWidth))>maxW||ws.reduce((a,w)=>a+w.offsetHeight+6,0)>room())){fs-=4;fit()}
</script>
</body></html>
