<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Dev;src:url({{FONTS}}/NotoSansDevanagari.ttf)}
@font-face{font-family:Inter;src:url({{FONTS}}/Inter.ttf)}
html,body{margin:0;padding:0;background:#000}
#root{position:relative;width:{{W}}px;height:{{H}}px;overflow:hidden;background:#000;font-family:Inter,Dev,sans-serif;color:#fff}
.band{position:absolute;left:0;right:0;background:#000}
.top{top:0;height:17%;display:flex;align-items:center;justify-content:center;padding:0 60px;text-align:center}
.title{font-weight:800;font-size:74px;line-height:1.15;letter-spacing:-1px}
.title .k{color:#FFD166}
.panel{position:absolute;left:0;right:0;top:17%;height:66%;object-fit:cover;width:100%}
.wm{position:absolute;left:0;right:0;top:77%;text-align:center;font-weight:600;font-size:34px;color:rgba(255,255,255,.85);text-shadow:0 2px 8px #000}
.bottom{bottom:0;height:17%;display:flex;align-items:center;justify-content:center;padding:0 70px;text-align:center}
.cap{font-family:Georgia,"Times New Roman",Dev,serif;font-style:italic;font-weight:700;font-size:52px;line-height:1.25}
</style></head><body><div id="root">
<div class="band top"><div class="title">{{title}}</div></div>
<img class="panel" src="{{panel_path}}">
<div class="wm">@sanjeev_gulia</div>
<div class="band bottom"><div class="cap">{{caption}}</div></div>
</div></body></html>
