<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url({{FONTS}}/Inter.ttf)}
html,body{margin:0;padding:0;background:transparent}
#root{position:relative;width:{{W}}px;height:{{H}}px;overflow:hidden;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center}
.chip{padding:14px 40px;border-radius:45px;font-weight:800;font-size:40px;letter-spacing:2px;text-transform:uppercase;color:#0B0F1A;background:#FFD166;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.chip.archaeology{background:#7CE38B}.chip.disputed{background:#FF4D4D;color:#fff}.chip.legend{background:#B48CFF}.chip.scripture{background:#FFD166}
</style></head><body><div id="root"><span class="chip {{label}}">{{label}}</span></div></body></html>
